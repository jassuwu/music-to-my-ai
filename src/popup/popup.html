<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #14161c;
        --panel: #1d202a;
        --line: #2a2e3a;
        --text: #e7e9ee;
        --dim: #949aab;
        --accent: #ffc978;
      }
      * { box-sizing: border-box; }
      body {
        width: 288px; margin: 0; padding: 16px 16px 14px;
        background: var(--bg); color: var(--text);
        font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
      }
      header { display: flex; align-items: center; justify-content: space-between; }
      h1 { font-size: 14px; margin: 0; letter-spacing: -0.01em; }

      /* master switch */
      .switch { position: relative; width: 38px; height: 22px; flex: none; }
      .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
      .track {
        position: absolute; inset: 0; border-radius: 999px;
        background: var(--line); transition: background .15s; pointer-events: none;
      }
      .track::after {
        content: ""; position: absolute; top: 3px; left: 3px;
        width: 16px; height: 16px; border-radius: 50%;
        background: var(--text); transition: transform .15s;
      }
      .switch input:checked + .track { background: var(--accent); }
      .switch input:checked + .track::after { transform: translateX(16px); background: #14161c; }

      h2 {
        font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
        color: var(--dim); font-weight: 600; margin: 18px 0 8px;
      }

      input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
      .vol-row { display: flex; align-items: center; gap: 10px; }
      .vol-val { font-variant-numeric: tabular-nums; color: var(--dim); width: 34px; text-align: right; }

      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .inst {
        font: inherit; text-align: left; color: var(--text);
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 7px; padding: 7px 9px; cursor: pointer;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .inst:hover { border-color: #3d4354; }
      .inst[aria-pressed="true"] {
        background: var(--accent); color: #14161c;
        border-color: var(--accent); font-weight: 600;
      }

      .site { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
      .site label { color: var(--dim); }

      footer {
        margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--line);
        color: var(--dim); font-size: 11px; display: flex; justify-content: space-between;
      }
      kbd {
        font: inherit; background: var(--panel); border: 1px solid var(--line);
        border-radius: 4px; padding: 1px 5px;
      }
      body.off .grid, body.off .vol-row, body.off .sites { opacity: .4; pointer-events: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>Music to My Agents</h1>
      <span class="switch">
        <input type="checkbox" id="power" aria-label="Enable sound" />
        <span class="track"></span>
      </span>
    </header>

    <h2>Volume</h2>
    <div class="vol-row">
      <input type="range" id="volume" min="0" max="100" step="1" />
      <span class="vol-val" id="volume-val">60%</span>
    </div>

    <h2>Instrument</h2>
    <div class="grid" id="instruments"></div>

    <h2>Sites</h2>
    <div class="sites" id="sites"></div>

    <footer>
      <span>Mute</span>
      <kbd id="shortcut">⌘⇧M</kbd>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
