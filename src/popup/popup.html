<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg:          #0E0E10;
        --panel:       #17171B;
        --line:        #2A2A31;
        --line-strong: #3A3A44;
        --text:        #F2F0EC;
        --dim:         #8F8C94;
        --accent:      #FF7A1A;
        --signal:      #5FE3A1;

        --font-label: "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed",
                      system-ui, sans-serif;
        --font-mono: Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
      }
      * { box-sizing: border-box; }

      body {
        width: 288px; margin: 0; padding: 0;
        background: var(--bg); color: var(--text);
        font-family: var(--font-label);
        user-select: none;
      }

      /* --- top plate ------------------------------------------------------- */
      .plate { padding: 12px 14px 10px; }

      header { display: flex; align-items: center; gap: 9px; }
      .mark { width: 16px; height: 16px; flex: none; }
      .wordmark {
        font-size: 11px; font-weight: 600; letter-spacing: .12em;
        text-transform: uppercase; margin-right: auto;
      }

      /* power: a real switch with a lamp above it */
      .power { display: flex; align-items: center; gap: 7px; }
      .lamp {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--line-strong); transition: background .15s, box-shadow .15s;
      }
      body:not(.off) .lamp { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
      .switch { position: relative; width: 30px; height: 16px; flex: none; }
      .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
      .track {
        position: absolute; inset: 0; border-radius: 2px;
        background: #0A0A0C; border: 1px solid var(--line-strong);
        pointer-events: none;
      }
      .track::after {
        content: ""; position: absolute; top: 1px; left: 1px;
        width: 12px; height: 12px; border-radius: 1px;
        background: var(--dim); transition: transform .1s, background .1s;
      }
      .switch input:checked + .track::after {
        transform: translateX(14px); background: var(--text);
      }
      .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* --- the comb: six tines you strike ---------------------------------- */
      .comb-well {
        margin: 12px 0 0; padding: 14px 12px 0;
        background: linear-gradient(#121216, #0B0B0D);
        border: 1px solid var(--line); border-radius: 4px;
        box-shadow: inset 0 1px 0 #22222a;
      }
      .comb {
        display: flex; align-items: flex-end; gap: 5px; height: 86px;
      }
      .tine {
        flex: 1; padding: 0; cursor: pointer;
        background: linear-gradient(#4A4A55, #33333C);
        border: none; border-radius: 3px 3px 0 0;
        box-shadow: inset 0 1px 0 #6A6A78;
        transition: background .12s, box-shadow .12s, transform .07s;
        transform-origin: bottom;
      }
      .tine:hover { background: linear-gradient(#5C5C6A, #3D3D48); }
      .tine[aria-pressed="true"] {
        background: linear-gradient(#FF9A45, #E2650A);
        box-shadow: inset 0 1px 0 #FFC49A, 0 0 12px rgba(255,122,26,.35);
      }
      .tine:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
      .tine.struck { animation: strike 260ms cubic-bezier(.2,.7,.3,1); }
      @keyframes strike {
        0%   { transform: scaleY(1); }
        18%  { transform: scaleY(1.06) translateY(2px); }
        100% { transform: scaleY(1); }
      }

      /* the bridge the tines are clamped under */
      .bridge {
        height: 9px; margin: 0 -12px;
        background: linear-gradient(#2E2E37, #1A1A20);
        border-top: 1px solid #43434F;
        box-shadow: 0 -2px 6px rgba(0,0,0,.55);
      }

      /* --- readout --------------------------------------------------------- */
      .readout {
        display: flex; align-items: baseline; gap: 8px;
        padding: 9px 12px 11px;
        background: #0B0B0D; border: 1px solid var(--line);
        border-top: none; border-radius: 0 0 4px 4px;
      }
      .voice {
        font-size: 19px; font-weight: 600; letter-spacing: .04em;
        text-transform: uppercase; color: var(--accent);
        margin-right: auto; line-height: 1;
      }
      .voice.flash { animation: phos 240ms ease-out; }
      @keyframes phos { from { color: var(--signal); } to { color: var(--accent); } }
      .index {
        font-family: var(--font-mono); font-size: 10px; color: var(--dim);
      }

      /* --- fader ----------------------------------------------------------- */
      .strip { display: flex; align-items: center; gap: 10px; padding: 13px 14px 0; }
      .silk {
        font-size: 9px; font-weight: 600; letter-spacing: .16em;
        text-transform: uppercase; color: var(--dim); flex: none;
      }
      .fader { flex: 1; }
      input[type="range"] {
        -webkit-appearance: none; appearance: none;
        width: 100%; margin: 0; background: transparent; cursor: pointer; display: block;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 2px; background: var(--line-strong);
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 9px; height: 17px; margin-top: -7.5px; border-radius: 1px;
        background: linear-gradient(#F2F0EC, #B9B6B0);
        box-shadow: 0 1px 2px rgba(0,0,0,.6);
      }
      input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
      .ticks {
        height: 3px; margin-top: 4px;
        background: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px 20%);
      }
      .vol-val {
        font-family: var(--font-mono); font-size: 10px; color: var(--dim);
        font-variant-numeric: tabular-nums; width: 26px; text-align: right; flex: none;
      }

      /* --- sites as lamps --------------------------------------------------- */
      .sites { display: flex; gap: 16px; padding: 12px 14px 0; }
      .site {
        display: flex; align-items: center; gap: 6px;
        background: none; border: none; padding: 0; cursor: pointer;
        font-family: var(--font-mono); font-size: 10px; color: var(--dim);
      }
      .site .lamp { width: 5px; height: 5px; }
      .site[aria-pressed="true"] { color: var(--text); }
      .site[aria-pressed="true"] .lamp {
        background: var(--signal); box-shadow: 0 0 5px var(--signal);
      }
      .site:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

      footer {
        display: flex; align-items: center; justify-content: space-between;
        margin: 13px 14px 0; padding: 9px 0 11px;
        border-top: 1px solid var(--line);
        font-size: 9px; font-weight: 600; letter-spacing: .16em;
        text-transform: uppercase; color: var(--dim);
      }
      kbd {
        font-family: var(--font-mono); font-size: 10px; letter-spacing: 0;
        color: var(--text); background: var(--panel);
        border: 1px solid var(--line-strong); border-radius: 2px; padding: 1px 5px;
      }
      .code { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0; }

      body.off .comb-well, body.off .readout, body.off .strip, body.off .sites {
        opacity: .3; pointer-events: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .tine.struck { animation: none; }
        .voice.flash { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="plate">
      <header>
        <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
          <rect x="16" y="16" width="96" height="96" rx="24" fill="#FF7A1A"/>
          <g fill="#0E0E10">
            <rect x="28" y="68" width="12" height="24" rx="6"/>
            <rect x="48" y="36" width="12" height="56" rx="6"/>
            <rect x="68" y="76" width="12" height="16" rx="6"/>
            <rect x="88" y="54" width="12" height="38" rx="6"/>
          </g>
        </svg>
        <span class="wordmark">Music to my agents</span>
        <span class="power">
          <span class="lamp"></span>
          <span class="switch">
            <input type="checkbox" id="power" aria-label="Enable sound" />
            <span class="track"></span>
          </span>
        </span>
      </header>

      <div class="comb-well">
        <div class="comb" id="comb" role="group" aria-label="Voice"></div>
        <div class="bridge"></div>
      </div>
      <div class="readout">
        <span class="voice" id="voice">Kalimba</span>
        <span class="index" id="index">01/06</span>
      </div>

      <div class="strip">
        <span class="silk">Vol</span>
        <span class="fader">
          <input type="range" id="volume" min="0" max="100" step="1" aria-label="Volume" />
          <span class="ticks"></span>
        </span>
        <span class="vol-val" id="volume-val">60</span>
      </div>

      <div class="sites" id="sites"></div>

      <footer>
        <span>Mute</span>
        <kbd id="shortcut">⌘⇧M</kbd>
        <span class="code">MTMA·01</span>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
