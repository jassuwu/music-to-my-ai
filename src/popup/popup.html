<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aux</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 240px; margin: 0;
        font: 13px/1.5 system-ui, sans-serif;
      }
      section { padding: 10px 14px; }
      section + section {
        border-top: 1px solid light-dark(rgba(0, 0, 0, 0.08), rgba(255, 255, 255, 0.1));
      }
      label { display: flex; align-items: center; gap: 8px; }
      .voices label, .sites label { padding: 2px 0; }
      input { margin: 0; }
      input[type="range"] { flex: 1; }
      kbd {
        margin-left: auto;
        font: 11px system-ui, sans-serif;
        color: light-dark(rgba(0, 0, 0, 0.5), rgba(255, 255, 255, 0.5));
      }
    </style>
  </head>
  <body>
    <section class="voices" id="voices"></section>
    <section>
      <label>Volume <input type="range" id="volume" min="0" max="100" step="1" /></label>
    </section>
    <section class="sites" id="sites"></section>
    <section>
      <label><input type="checkbox" id="mute" /> Mute <kbd id="shortcut">⌘⇧M</kbd></label>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
