<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg:          #0E0E10;
        --panel:       #17171B;
        --line:        #2A2A31;
        --line-strong: #3A3A44;
        --text:        #F2F0EC;
        --dim:         #8F8C94;
        --accent:      #FF7A1A;  /* lit only: selected voice, power on */
        --signal:      #5FE3A1;  /* motion only: the strike flash */

        --font-label: "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed",
                      system-ui, sans-serif;
        --font-mono: Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
      }
      * { box-sizing: border-box; }

      body {
        width: 288px; margin: 0; padding: 14px 16px 12px;
        background: var(--bg); color: var(--text);
        font-family: var(--font-label);
      }

      /* --- header: mark, wordmark, power ---------------------------------- */
      header { display: flex; align-items: center; gap: 10px; }
      .mark { width: 18px; height: 18px; flex: none; }
      .mark rect.tine { transform-box: fill-box; transform-origin: bottom; }
      .brand { display: flex; flex-direction: column; line-height: 1.15; margin-right: auto; }
      .wordmark {
        font-size: 12px; font-weight: 600;
        text-transform: uppercase; letter-spacing: .10em;
      }
      .code { font-family: var(--font-mono); font-size: 9px; color: var(--dim); }

      /* --- hardware slide switches ---------------------------------------- */
      .switch { position: relative; width: 34px; height: 18px; flex: none; }
      .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
      .track {
        position: absolute; inset: 0; border-radius: 3px;
        background: var(--panel); border: 1px solid var(--line-strong);
        transition: background .12s, border-color .12s; pointer-events: none;
      }
      .track::after {
        content: ""; position: absolute; top: 1px; left: 1px;
        width: 14px; height: 14px; border-radius: 2px;
        background: var(--dim); transition: transform .12s, background .12s;
      }
      .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
      .switch input:checked + .track::after { transform: translateX(16px); background: var(--bg); }
      .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* --- silkscreen section labels -------------------------------------- */
      h2 {
        display: flex; align-items: center; gap: 8px;
        font-size: 10px; font-weight: 600; color: var(--dim);
        text-transform: uppercase; letter-spacing: .14em;
        margin: 16px 0 8px;
      }
      h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

      /* --- fader ----------------------------------------------------------- */
      .vol-row { display: flex; align-items: center; gap: 10px; }
      .fader { flex: 1; }
      input[type="range"] {
        -webkit-appearance: none; appearance: none;
        width: 100%; margin: 0; background: transparent; cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 3px; border-radius: 2px; background: var(--line-strong);
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 10px; height: 18px; margin-top: -7.5px;
        border-radius: 2px; background: var(--text);
      }
      input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
      .ticks {
        height: 4px; margin-top: 3px;
        background: repeating-linear-gradient(
          to right, var(--line) 0 1px, transparent 1px 25%);
      }
      .vol-val {
        font-family: var(--font-mono); font-size: 11px; color: var(--dim);
        font-variant-numeric: tabular-nums; width: 32px; text-align: right;
      }

      /* --- voice grid ------------------------------------------------------ */
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
      .inst {
        position: relative; overflow: hidden;
        font-family: var(--font-label); font-size: 10.5px; font-weight: 500;
        text-transform: uppercase; letter-spacing: .06em; text-align: left;
        color: var(--text); background: var(--panel);
        border: 1px solid var(--line-strong); border-radius: 3px;
        padding: 7px 8px; cursor: pointer;
        transition: border-color .12s, background .12s, transform .06s;
      }
      .inst:hover { border-color: var(--dim); }
      .inst[aria-pressed="true"] {
        background: var(--accent); color: var(--bg);
        border-color: var(--accent); font-weight: 600;
      }
      .inst:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      /* the strike: a phosphor edge that decays */
      .inst::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
        background: var(--signal); opacity: 0;
      }
      .inst.struck::before { animation: decay 240ms ease-out; }
      .inst.struck { transform: translateY(1px); }
      @keyframes decay { from { opacity: 1; } to { opacity: 0; } }
      @keyframes strike {
        0%   { transform: scaleY(1);    fill: var(--bg); }
        15%  { transform: scaleY(1.35); fill: #FFF6EC; }
        100% { transform: scaleY(1);    fill: var(--bg); }
      }
      .mark rect.hit { animation: strike 280ms cubic-bezier(.2,.7,.3,1); }

      /* --- sites ----------------------------------------------------------- */
      .site { display: flex; align-items: center; justify-content: space-between; padding: 3px 0; }
      .site label { font-family: var(--font-mono); font-size: 11px; color: var(--dim); }

      footer {
        display: flex; align-items: center; justify-content: space-between;
        margin-top: 14px; padding-top: 9px; border-top: 1px solid var(--line);
        font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim);
      }
      kbd {
        font-family: var(--font-mono); font-size: 10px; letter-spacing: 0;
        color: var(--text); background: var(--panel);
        border: 1px solid var(--line-strong); border-radius: 3px; padding: 1px 5px;
      }

      body.off .grid, body.off .vol-row, body.off .sites { opacity: .35; pointer-events: none; }

      @media (prefers-reduced-motion: reduce) {
        .inst.struck { transform: none; }
        .mark rect.hit { animation: none; fill: #FFF6EC; }
      }
    </style>
  </head>
  <body>
    <header>
      <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
        <rect x="16" y="16" width="96" height="96" rx="24" fill="#FF7A1A"/>
        <rect class="tine" x="28" y="68" width="12" height="24" rx="6" fill="#0E0E10"/>
        <rect class="tine" x="48" y="36" width="12" height="56" rx="6" fill="#0E0E10"/>
        <rect class="tine" x="68" y="76" width="12" height="16" rx="6" fill="#0E0E10"/>
        <rect class="tine" x="88" y="54" width="12" height="38" rx="6" fill="#0E0E10"/>
      </svg>
      <span class="brand">
        <span class="wordmark">Music to my agents</span>
        <span class="code">MTMA · 01</span>
      </span>
      <span class="switch">
        <input type="checkbox" id="power" aria-label="Enable sound" />
        <span class="track"></span>
      </span>
    </header>

    <h2>Volume</h2>
    <div class="vol-row">
      <span class="fader">
        <input type="range" id="volume" min="0" max="100" step="1" aria-label="Volume" />
        <span class="ticks"></span>
      </span>
      <span class="vol-val" id="volume-val">60%</span>
    </div>

    <h2>Voice</h2>
    <div class="grid" id="instruments"></div>

    <h2>Sites</h2>
    <div class="sites" id="sites"></div>

    <footer>
      <span>Mute</span>
      <kbd id="shortcut">⌘⇧M</kbd>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
