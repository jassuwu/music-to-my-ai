<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Halo</title>
    <style>
      :root {
        --night: #0b0908;
        --gold: #e8c170;
        --hot: #fff0ce;
        --ember: #4a3b21;
        --ivory: #ede6da;
        --dim: #93887a;
        --line: #262019;

        --serif: "Iowan Old Style", Palatino, "Book Antiqua", Georgia, serif;
      }
      * { box-sizing: border-box; }

      body {
        width: 288px; margin: 0;
        background: var(--night); color: var(--ivory);
        font-family: var(--serif);
        user-select: none;
      }
      main { padding: 18px 0 0; text-align: center; }

      .wordmark {
        margin: 0; font-size: 12px; font-weight: 400;
        letter-spacing: 0.52em; text-indent: 0.52em; /* re-center the tracking */
        text-transform: uppercase; color: var(--dim);
      }

      /* --- the halo ------------------------------------------------------- */
      .sky { position: relative; height: 210px; margin-top: 2px; }

      .halo, .ripple-ring, .heart, .orb, .ripple {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
      }

      .ripple-ring {
        width: 194px; height: 194px;
        border: 1px solid rgba(232, 193, 112, 0.13);
      }
      .halo {
        width: 142px; height: 142px;
        border: 2px solid var(--gold);
        box-shadow:
          0 0 22px rgba(232, 193, 112, 0.32),
          0 0 6px rgba(255, 240, 206, 0.5),
          inset 0 0 16px rgba(232, 193, 112, 0.16);
        transition: border-color 0.3s, box-shadow 0.3s;
      }

      /* the heart of the ring: sound on and off */
      .heart {
        width: 48px; height: 48px;
        border: none; cursor: pointer; padding: 0;
        background: radial-gradient(circle,
          rgba(255, 240, 206, 0.85) 0%,
          rgba(232, 193, 112, 0.35) 22%,
          rgba(232, 193, 112, 0.07) 46%,
          transparent 70%);
        transition: opacity 0.3s;
      }
      .heart:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

      /* voices are lights on the ring, placed by register */
      .orb {
        width: 16px; height: 16px;
        border: 1px solid var(--ember); background: #191307;
        cursor: pointer; padding: 0;
        transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
      }
      .orb:hover { border-color: var(--gold); background: #2e2410; }
      .orb[aria-pressed="true"] {
        background: var(--hot); border-color: var(--hot);
        box-shadow: 0 0 12px rgba(255, 240, 206, 0.75), 0 0 26px rgba(232, 193, 112, 0.4);
      }
      .orb:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

      .ripple {
        width: 142px; height: 142px;
        border: 1.5px solid var(--gold);
        pointer-events: none;
        animation: ripple 900ms ease-out forwards;
      }
      @keyframes ripple {
        from { opacity: 0.55; width: 142px; height: 142px; }
        to   { opacity: 0;    width: 234px; height: 234px; }
      }

      /* --- the chosen voice ----------------------------------------------- */
      .voice-line { margin: 6px 0 0; height: 30px; }
      #voice {
        font-size: 23px; letter-spacing: 0.02em; color: var(--ivory);
        transition: color 0.5s;
      }
      #voice.struck { color: var(--hot); transition: none; }

      /* --- volume ---------------------------------------------------------- */
      .volume-line {
        display: flex; align-items: center; gap: 10px;
        margin: 16px 24px 0;
      }
      .silk {
        font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase;
        color: var(--dim); flex: none;
      }
      input[type="range"] {
        -webkit-appearance: none; appearance: none;
        flex: 1; margin: 0; cursor: pointer; background: transparent;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 1px;
        background: linear-gradient(to right,
          var(--gold) var(--vol, 60%), var(--line) var(--vol, 60%));
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 11px; height: 11px; margin-top: -5px; border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 8px rgba(232, 193, 112, 0.55);
      }
      input[type="range"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; }
      #volume-val {
        font-size: 11px; color: var(--dim);
        font-variant-numeric: tabular-nums; width: 20px; text-align: right; flex: none;
      }

      /* --- sites ------------------------------------------------------------ */
      .sites { display: flex; justify-content: center; gap: 22px; margin-top: 15px; }
      .site {
        display: flex; align-items: center; gap: 6px;
        background: none; border: none; padding: 0; cursor: pointer;
        font-family: var(--serif); font-size: 12px; color: var(--dim);
        transition: color 0.2s;
      }
      .site .lamp {
        width: 5px; height: 5px; border-radius: 50%;
        background: var(--ember); transition: background 0.2s, box-shadow 0.2s;
      }
      .site[aria-pressed="true"] { color: var(--ivory); }
      .site[aria-pressed="true"] .lamp {
        background: var(--gold); box-shadow: 0 0 6px rgba(232, 193, 112, 0.8);
      }
      .site:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

      footer {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        margin: 16px 24px 0; padding: 10px 0 12px;
        border-top: 1px solid var(--line);
        font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--dim);
      }
      kbd {
        font-family: var(--serif); font-size: 11px; letter-spacing: 0.06em;
        color: var(--ivory); border: 1px solid var(--line);
        border-radius: 3px; padding: 1px 6px;
      }

      /* --- muted: the halo goes dark ---------------------------------------- */
      body.off .halo { border-color: var(--ember); box-shadow: none; }
      body.off .heart { opacity: 0.14; }
      body.off .ripple-ring { opacity: 0.4; }
      body.off .orb,
      body.off .voice-line, body.off .volume-line, body.off .sites {
        opacity: 0.3; pointer-events: none;
      }
      body.off .orb[aria-pressed="true"] { background: var(--dim); box-shadow: none; }

      @media (prefers-reduced-motion: reduce) {
        .ripple { animation: none; opacity: 0; }
        #voice.struck { color: var(--ivory); }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="wordmark">Halo</h1>

      <div class="sky" id="sky">
        <div class="ripple-ring"></div>
        <div class="halo"></div>
        <button class="heart" id="power" aria-label="Sound on or off" title="Sound on or off"></button>
      </div>

      <p class="voice-line"><span id="voice">Kalimba</span></p>

      <div class="volume-line">
        <label class="silk" for="volume">Volume</label>
        <input type="range" id="volume" min="0" max="100" step="1" />
        <span id="volume-val">60</span>
      </div>

      <div class="sites" id="sites"></div>

      <footer>
        <span>Mute</span>
        <kbd id="shortcut">⌘⇧M</kbd>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
